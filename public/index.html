 <!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>シリアルコード一括読取</title>
  <style>
    :root {
      --primary: #8b5cf6;
      --primary-dark: #7c3aed;
      --primary-light: #ede9fe;
      --accent: #ec4899;
      --bg: #faf5ff;
      --card: #ffffff;
      --text: #1e1b4b;
      --muted: #6b7280;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      max-width: 480px;
      margin: 0 auto;
      padding: 20px 16px 40px;
      background: var(--bg);
      color: var(--text);
    }

    .header { text-align: center; margin-bottom: 16px; }
    .header h1 {
      font-size: 1.3rem;
      margin: 0 0 4px;
      font-weight: 800;
      background: linear-gradient(135deg, var(--primary-dark), var(--accent));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .header p { font-size: 0.75rem; color: var(--muted); margin: 0; }

    /* iOSで確実にイベントを拾うための透明オーバーレイ構造 */
    .upload-card {
      position: relative;
      border: 2px dashed #c4b5fd;
      border-radius: 14px;
      padding: 22px 14px;
      text-align: center;
      background: var(--card);
      box-shadow: 0 4px 12px rgba(139, 92, 246, 0.05);
      overflow: hidden;
    }
    .upload-icon { font-size: 1.8rem; margin-bottom: 4px; }
    .upload-label { font-weight: 700; font-size: 0.95rem; color: var(--primary-dark); }
    .upload-sub { font-size: 0.75rem; color: var(--muted); margin-top: 2px; }

    /* inputタグをカード全体に透明で被せる */
    .file-input-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      opacity: 0;
      cursor: pointer;
      z-index: 10;
    }

    .btn-main {
      width: 100%;
      background: linear-gradient(135deg, var(--primary), var(--accent));
      color: #fff;
      border: none;
      padding: 13px;
      border-radius: 12px;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
      margin-top: 12px;
      box-shadow: 0 4px 14px rgba(236, 72, 153, 0.25);
    }
    .btn-main:disabled { opacity: 0.5; cursor: not-allowed; box-shadow: none; }

    #status {
      margin: 14px 0 8px;
      font-size: 0.85rem;
      color: var(--primary-dark);
      text-align: center;
      font-weight: 600;
      min-height: 20px;
    }

    .result-section { margin-top: 16px; display: none; }
    .result-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }
    .result-title { font-size: 0.9rem; font-weight: 700; }
    .btn-all-copy {
      background: var(--card);
      border: 1px solid #c4b5fd;
      color: var(--primary-dark);
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 0.75rem;
      font-weight: 700;
      cursor: pointer;
    }

    .code-list { display: flex; flex-direction: column; gap: 8px; }
    .code-item {
      background: var(--card);
      border: 1px solid #e9d5ff;
      border-radius: 12px;
      padding: 10px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 2px 5px rgba(0,0,0,0.02);
    }
    .code-item.copied { background: #f3f4f6; border-color: #d1d5db; }
    .code-item.copied .code-text { color: #9ca3af; text-decoration: line-through; }
    .code-left { display: flex; align-items: center; gap: 10px; overflow: hidden; }
    .code-num { font-size: 0.8rem; font-weight: 700; color: var(--primary); min-width: 28px; }
    .code-text {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 0.95rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .code-error { color: #ef4444; font-size: 0.8rem; }
    .btn-copy-one {
      background: var(--primary-light);
      color: var(--primary-dark);
      border: none;
      padding: 7px 14px;
      border-radius: 8px;
      font-size: 0.75rem;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
    }
    .btn-copy-one.copied-btn { background: #e5e7eb; color: #4b5563; }
  </style>
</head>
<body>

  <div class="header">
    <h1>✨ シリアル一括読取ツール</h1>
    <p>シリアル用紙を撮るだけ！まとめて超速スキャン</p>
  </div>

  <div class="upload-card">
    <input type="file" id="fileInput" class="file-input-overlay" accept="image/*" multiple>
    <div class="upload-icon">📸</div>
    <div class="upload-label" id="fileLabel">シリアル用紙の写真を選択</div>
    <div class="upload-sub">複数枚まとめて選択OK</div>
  </div>

  <button class="btn-main" id="runBtn" onclick="processImages()">読み取り開始</button>
  <div id="status"></div>

  <div class="result-section" id="resultSection">
    <div class="result-header">
      <span class="result-title">読取結果 (<span id="resultCount">0</span>件)</span>
      <button class="btn-all-copy" onclick="copyAll()">📋 全件まとめてコピー</button>
    </div>
    <div class="code-list" id="codeList"></div>
  </div>

  <script>
    let selectedFiles = [];
    let extractedCodes = [];

    const fileInput = document.getElementById('fileInput');
    const fileLabel = document.getElementById('fileLabel');

    fileInput.addEventListener('change', function() {
      if (this.files && this.files.length > 0) {
        selectedFiles = Array.from(this.files);
        fileLabel.innerText = `✨ ${selectedFiles.length} 枚の写真を選択中`;
      }
    });

    // 端末側で高速軽量化（800px・70%品質）
    async function compressImage(file) {
      return new Promise((resolve) => {
        const reader = new FileReader();
        reader.onload = (e) => {
          const img = new Image();
          img.onload = () => {
            const maxDim = 800;
            let { width, height } = img;
            if (width > maxDim || height > maxDim) {
              if (width > height) {
                height = Math.round((height * maxDim) / width);
                width = maxDim;
              } else {
                width = Math.round((width * maxDim) / height);
                height = maxDim;
              }
            }
            const canvas = document.createElement('canvas');
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, width, height);
            const dataUrl = canvas.toDataURL('image/jpeg', 0.7);
            resolve(dataUrl.split(',')[1]);
          };
          img.src = e.target.result;
        };
        reader.readAsDataURL(file);
      });
    }

    const sleep = (ms) => new Promise(r => setTimeout(r, ms));

    async function extractSingle(file, retryCount = 0) {
      const base64 = await compressImage(file);
      const res = await fetch('/api', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ imageBase64: base64, mimeType: 'image/jpeg' })
      });

      const data = await res.json();

      // レート制限エラー時は1.2秒待って再試行
      if (data.error && data.error.includes('exceeded') && retryCount < 2) {
        await sleep(1200);
        return await extractSingle(file, retryCount + 1);
      }

      if (data.error) throw new Error(data.error);
      return data.code || '読取失敗';
    }

    async function processImages() {
      if (!selectedFiles.length) return alert('写真を1枚以上選んでください');

      const btn = document.getElementById('runBtn');
      const status = document.getElementById('status');
      const resultSection = document.getElementById('resultSection');
      const resultCount = document.getElementById('resultCount');

      btn.disabled = true;
      extractedCodes = new Array(selectedFiles.length).fill('');
      renderList(extractedCodes);
      resultSection.style.display = 'block';

      let completed = 0;
      status.innerText = `解析中... (0 / ${selectedFiles.length})`;

      const CONCURRENCY = 2;
      const queue = [...selectedFiles.entries()];

      async function worker() {
        while (queue.length > 0) {
          const [index, file] = queue.shift();
          try {
            const code = await extractSingle(file);
            extractedCodes[index] = code;
          } catch (e) {
            extractedCodes[index] = `読取エラー`;
          }
          completed++;
          status.innerText = `解析中... (${completed} / ${selectedFiles.length})`;
          renderList(extractedCodes);
          await sleep(250);
        }
      }

      const workers = Array.from({ length: Math.min(CONCURRENCY, selectedFiles.length) }, () => worker());
      await Promise.all(workers);

      status.innerText = '✨ すべての読み取りが完了しました！';
      btn.disabled = false;
      resultCount.innerText = extractedCodes.filter(c => c && !c.includes('エラー')).length;
    }

    function renderList(codes) {
      const codeList = document.getElementById('codeList');
      codeList.innerHTML = '';
      codes.forEach((code, i) => {
        if (!code) return;
        const isErr = code.includes('エラー') || code === '読取失敗';
        const item = document.createElement('div');
        item.className = 'code-item';
        item.id = `item-${i}`;
        item.innerHTML = `
          <div class="code-left">
            <span class="code-num">#${i + 1}</span>
            <span class="code-text ${isErr ? 'code-error' : ''}">${code}</span>
          </div>
          ${!isErr ? `<button class="btn-copy-one" id="btn-${i}" onclick="copyOne(${i}, '${code}')">コピー</button>` : ''}
        `;
        codeList.appendChild(item);
      });
    }

    function copyOne(index, text) {
      navigator.clipboard.writeText(text).then(() => {
        const item = document.getElementById(`item-${index}`);
        const btn = document.getElementById(`btn-${index}`);
        item.classList.add('copied');
        btn.classList.add('copied-btn');
        btn.innerText = '済';
      });
    }

    function copyAll() {
      const validCodes = extractedCodes.filter(c => c && !c.includes('エラー') && c !== '読取失敗');
      if (!validCodes.length) return alert('コピーできるコードがありません');
      navigator.clipboard.writeText(validCodes.join('\n')).then(() => {
        alert(`${validCodes.length}件のコードをコピーしました！`);
      });
    }
  </script>
</body>
</html>

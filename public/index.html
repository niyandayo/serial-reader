<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>シリアルコード一括読取</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      max-width: 500px;
      margin: 0 auto;
      padding: 20px 16px;
      background: #f8fafc;
      color: #0f172a;
    }
    h1 { font-size: 1.2rem; margin-bottom: 16px; text-align: center; }
    .upload-box {
      border: 2px dashed #94a3b8;
      border-radius: 8px;
      padding: 24px;
      text-align: center;
      background: #fff;
      cursor: pointer;
      margin-bottom: 12px;
    }
    .btn {
      width: 100%;
      background: #2563eb;
      color: #fff;
      border: none;
      padding: 12px;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      font-size: 1rem;
    }
    .btn:disabled { background: #94a3b8; }
    #status { margin: 12px 0; font-size: 0.9rem; color: #475569; text-align: center; font-weight: bold; }
    textarea {
      width: 100%;
      height: 140px;
      padding: 10px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      font-family: monospace;
      font-size: 0.95rem;
      margin-top: 12px;
      background: #fff;
    }
    .copy-btn {
      background: #0f172a;
      color: #fff;
      margin-top: 8px;
    }
  </style>
</head>
<body>

  <h1>🎫 シリアル一括読取ツール</h1>

  <div class="upload-box" onclick="document.getElementById('fileInput').click()">
    <div id="fileLabel">📷 写真を選択（複数枚まとめてOK）</div>
    <input type="file" id="fileInput" accept="image/*" multiple style="display: none;" onchange="updateLabel(this.files)">
  </div>

  <button class="btn" id="runBtn" onclick="processImages()">読み取り開始</button>
  <div id="status"></div>

  <div id="resultArea" style="display: none;">
    <textarea id="output" readonly placeholder="結果がここに並びます"></textarea>
    <button class="btn copy-btn" onclick="copyAll()">📋 全件まとめてコピー</button>
  </div>

  <script>
    let files = [];
    function updateLabel(selected) {
      files = Array.from(selected);
      document.getElementById('fileLabel').innerText = `${files.length} 枚選択中`;
    }

    // iPhoneの写真(HEIC/高画質)を安全に縮小する処理
    async function resizeAndCompress(file) {
      let imgSource;
      try {
        imgSource = await createImageBitmap(file);
      } catch (err) {
        imgSource = await new Promise((resolve, reject) => {
          const img = new Image();
          img.onload = () => resolve(img);
          img.onerror = reject;
          img.src = URL.createObjectURL(file);
        });
      }

      const maxDim = 1200;
      let width = imgSource.width;
      let height = imgSource.height;

      if (width > maxDim || height > maxDim) {
        if (width > height) {
          height = Math.round((height * maxDim) / width);
          width = maxDim;
        } else {
          width = Math.round((width * maxDim) / height);
          height = maxDim;
        }
      }

      const canvas = document.createElement('canvas');
      canvas.width = width;
      canvas.height = height;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(imgSource, 0, 0, width, height);

      const dataUrl = canvas.toDataURL('image/jpeg', 0.85);
      return dataUrl.split(',')[1];
    }

    async function processImages() {
      if (!files.length) return alert('写真を1枚以上選んでください');
      const btn = document.getElementById('runBtn');
      const status = document.getElementById('status');
      const resultArea = document.getElementById('resultArea');
      const output = document.getElementById('output');

      btn.disabled = true;
      resultArea.style.display = 'block';
      output.value = '';
      const results = [];

      for (let i = 0; i < files.length; i++) {
        status.innerText = `解析中 (${i + 1}/${files.length})...`;
        try {
          const base64 = await resizeAndCompress(files[i]);
          const res = await fetch('/api/extract', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ imageBase64: base64, mimeType: 'image/jpeg' })
          });
          const data = await res.json();
          if (data.error) {
            results.push(`エラー: ${data.error}`);
          } else {
            results.push(data.code || '読取失敗');
          }
        } catch (e) {
          results.push(`通信エラー (${e.message || 'fetch failed'})`);
        }
      }

      status.innerText = '完了しました！';
      output.value = results.join('\n');
      btn.disabled = false;
    }

    function copyAll() {
      const val = document.getElementById('output').value;
      navigator.clipboard.writeText(val);
      alert('コピーしました！');
    }
  </script>
</body>
</html>

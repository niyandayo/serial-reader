<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>シリアルコード一括読取</title>
  <style>
    :root {
      --primary: #8b5cf6;
      --primary-dark: #7c3aed;
      --primary-light: #ede9fe;
      --accent: #ec4899;
      --bg: #faf5ff;
      --card: #ffffff;
      --text: #1e1b4b;
      --muted: #6b7280;
    }

    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      max-width: 480px;
      margin: 0 auto;
      padding: 20px 16px 40px;
      background: var(--bg);
      color: var(--text);
    }

    .header { text-align: center; margin-bottom: 20px; }
    .header h1 {
      font-size: 1.35rem;
      margin: 0 0 6px;
      font-weight: 800;
      background: linear-gradient(135deg, var(--primary-dark), var(--accent));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .header p { font-size: 0.75rem; color: var(--muted); margin: 0; }

    .upload-card {
      background: var(--card);
      border: 2px dashed #c4b5fd;
      border-radius: 16px;
      padding: 24px 16px;
      text-align: center;
      box-shadow: 0 4px 12px rgba(139, 92, 246, 0.05);
    }
    .upload-icon { font-size: 2rem; margin-bottom: 8px; }
    
    input[type="file"] {
      font-size: 0.95rem;
      color: var(--primary-dark);
      font-weight: 600;
      width: 100%;
      max-width: 280px;
      margin: 0 auto;
      display: block;
    }

    #fileCountDisplay {
      margin-top: 10px;
      font-size: 0.9rem;
      font-weight: 700;
      color: var(--primary-dark);
    }

    .btn-main {
      width: 100%;
      background: linear-gradient(135deg, var(--primary), var(--accent));
      color: #fff;
      border: none;
      padding: 14px;
      border-radius: 12px;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
      margin-top: 14px;
      box-shadow: 0 4px 14px rgba(236, 72, 153, 0.25);
    }
    .btn-main:disabled { opacity: 0.5; cursor: not-allowed; box-shadow: none; }

    #status {
      margin: 16px 0 10px;
      font-size: 0.85rem;
      color: var(--primary-dark);
      text-align: center;
      font-weight: 700;
      min-height: 20px;
    }

    .result-section { margin-top: 16px; display: none; }
    .result-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }
    .result-title { font-size: 0.9rem; font-weight: 700; }
    .btn-all-copy {
      background: var(--card);
      border: 1px solid #c4b5fd;
      color: var(--primary-dark);
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 0.75rem;
      font-weight: 700;
      cursor: pointer;
    }

    .code-list { display: flex; flex-direction: column; gap: 8px; }
    .code-item {
      background: var(--card);
      border: 1px solid #e9d5ff;
      border-radius: 12px;
      padding: 10px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 2px 5px rgba(0,0,0,0.02);
    }
    .code-item.copied { background: #f3f4f6; border-color: #d1d5db; }
    .code-item.copied .code-text { color: #9ca3af; text-decoration: line-through; }
    .code-left { display: flex; align-items: center; gap: 10px; overflow: hidden; }
    .code-num { font-size: 0.8rem; font-weight: 700; color: var(--primary); min-width: 28px; }
    .code-text {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 0.95rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .code-error { color: #ef4444; font-size: 0.8rem; }
    .btn-copy-one {
      background: var(--primary-light);
      color: var(--primary-dark);
      border: none;
      padding: 7px 14px;
      border-radius: 8px;
      font-size: 0.75rem;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
    }
    .btn-copy-one.copied-btn { background: #e5e7eb; color: #4b5563; }
  </style>
</head>
<body>

  <div class="header">
    <h1>✨ シリアル一括読取ツール</h1>
    <p>シリアル用紙を撮るだけ！まとめて超速スキャン</p>
  </div>

  <div class="upload-card">
    <div class="upload-icon">📸</div>
    <input type="file" id="fileInput" accept="image/*" multiple>
    <div id="fileCountDisplay"></div>
  </div>

  <button class="btn-main" id="runBtn">読み取り開始</button>
  <div id="status"></div>

  <div class="result-section" id="resultSection">
    <div class="result-header">
      <span class="result-title">読取結果 (<span id="resultCount">0</span>件)</span>
      <button class="btn-all-copy" id="copyAllBtn">📋 全件まとめてコピー</button>
    </div>
    <div class="code-list" id="codeList"></div>
  </div>

  <script>
    let rawFiles = [];
    let extractedCodes = [];

    const fileInput = document.getElementById('fileInput');
    const fileCountDisplay = document.getElementById('fileCountDisplay');
    const runBtn = document.getElementById('runBtn');
    const copyAllBtn = document.getElementById('copyAllBtn');

    fileInput.addEventListener('change', function(e) {
      if (this.files && this.files.length > 0) {
        rawFiles = Array.from(this.files);
        fileCountDisplay.textContent = `✨ ${rawFiles.length} 枚の写真を選択しました`;
      }
    });

    // iOSクラッシュ対策：原画をフル展開せず、読み込みと同時に長辺1000pxへ安全にリサイズ
    async function compressImageSafely(file) {
      // 1. createImageBitmap が使える場合はリサイズ指定で安全に縮小デコード
      if ('createImageBitmap' in window) {
        try {
          const bitmap = await createImageBitmap(file, {
            resizeWidth: 1000,
            resizeQuality: 'medium'
          });
          const canvas = document.createElement('canvas');
          canvas.width = bitmap.width;
          canvas.height = bitmap.height;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(bitmap, 0, 0);
          bitmap.close(); // メモリを即時解放

          const base64 = canvas.toDataURL('image/jpeg', 0.75).split(',')[1];
          canvas.width = 0;
          canvas.height = 0;
          return base64;
        } catch (err) {
          // フォールバックへ流す
        }
      }

      // 2. フォールバック（通常読み込み）
      return new Promise((resolve, reject) => {
        const url = URL.createObjectURL(file);
        const img = new Image();
        img.onload = () => {
          URL.revokeObjectURL(url);
          const maxDim = 1000;
          let { width, height } = img;
          if (width > maxDim || height > maxDim) {
            if (width > height) {
              height = Math.round((height * maxDim) / width);
              width = maxDim;
            } else {
              width = Math.round((width * maxDim) / height);
              height = maxDim;
            }
          }
          const canvas = document.createElement('canvas');
          canvas.width = width;
          canvas.height = height;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, width, height);

          const dataUrl = canvas.toDataURL('image/jpeg', 0.75);
          canvas.width = 0;
          canvas.height = 0;
          resolve(dataUrl.split(',')[1]);
        };
        img.onerror = () => {
          URL.revokeObjectURL(url);
          reject(new Error('読込失敗'));
        };
        img.src = url;
      });
    }

    const sleep = (ms) => new Promise(r => setTimeout(r, ms));

    async function extractSingle(file, retryCount = 0) {
      const base64 = await compressImageSafely(file);
      const res = await fetch('/api', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ imageBase64: base64, mimeType: 'image/jpeg' })
      });

      const data = await res.json();

      const retryableStatus = res.status === 429 || (res.status >= 500 && res.status <= 599);
      if (data.retryable === true && retryableStatus && retryCount < 2) {
        await sleep(1500);
        return await extractSingle(file, retryCount + 1);
      }

      if (data.error) throw new Error(data.error);
      return data.code || '読取失敗';
    }

    async function processImages() {
      if (!rawFiles.length) return alert('「ファイルを選択」から写真を1枚以上選んでください');

      const btn = runBtn;
      const status = document.getElementById('status');
      const resultSection = document.getElementById('resultSection');
      const resultCount = document.getElementById('resultCount');

      btn.disabled = true;
      extractedCodes = new Array(rawFiles.length).fill('');
      renderList(extractedCodes);
      resultSection.style.display = 'block';

      let completed = 0;
      status.textContent = `解析中... (0 / ${rawFiles.length})`;

      for (let i = 0; i < rawFiles.length; i++) {
        const file = rawFiles[i];
        try {
          const code = await extractSingle(file);
          extractedCodes[i] = code;
        } catch (e) {
          extractedCodes[i] = `読取エラー`;
        }
        completed++;
        status.textContent = `解析中... (${completed} / ${rawFiles.length})`;
        renderList(extractedCodes);
        await sleep(250);
      }

      status.textContent = '✨ すべての読み取りが完了しました！';
      btn.disabled = false;
      resultCount.textContent = extractedCodes.filter(c => c && !c.includes('エラー')).length;
    }

    function renderList(codes) {
      const codeList = document.getElementById('codeList');
      codeList.replaceChildren();
      codes.forEach((code, i) => {
        if (!code) return;
        const isErr = code.includes('エラー') || code === '読取失敗';
        const item = document.createElement('div');
        item.className = 'code-item';
        item.id = `item-${i}`;

        const left = document.createElement('div');
        left.className = 'code-left';

        const number = document.createElement('span');
        number.className = 'code-num';
        number.textContent = `#${i + 1}`;

        const codeText = document.createElement('span');
        codeText.className = isErr ? 'code-text code-error' : 'code-text';
        codeText.textContent = code;

        left.append(number, codeText);
        item.appendChild(left);

        if (!isErr) {
          const copyButton = document.createElement('button');
          copyButton.className = 'btn-copy-one';
          copyButton.id = `btn-${i}`;
          copyButton.type = 'button';
          copyButton.textContent = 'コピー';
          copyButton.addEventListener('click', () => copyOne(i, code));
          item.appendChild(copyButton);
        }
        codeList.appendChild(item);
      });
    }

    function copyOne(index, text) {
      navigator.clipboard.writeText(text).then(() => {
        const item = document.getElementById(`item-${index}`);
        const btn = document.getElementById(`btn-${index}`);
        item.classList.add('copied');
        btn.classList.add('copied-btn');
        btn.textContent = '済';
      });
    }

    function copyAll() {
      const validCodes = extractedCodes.filter(c => c && !c.includes('エラー') && c !== '読取失敗');
      if (!validCodes.length) return alert('コピーできるコードがありません');
      navigator.clipboard.writeText(validCodes.join('\n')).then(() => {
        alert(`${validCodes.length}件のコードをコピーしました！`);
      });
    }

    runBtn.addEventListener('click', processImages);
    copyAllBtn.addEventListener('click', copyAll);
  </script>
</body>
</html>
